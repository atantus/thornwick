<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thornwick">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* base reset (the claude.ai page frame used to provide this) */
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Thornwick Idle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Karla:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column like a field journal; tabs for skills + bank, a sticky "now doing" bar at the bottom. Committed night-forest look, single theme. */
:root{
  --bg:#0f1a15;
  --panel:#16241d;
  --panel-2:#1d2f26;
  --line:#2b4136;
  --fg:#e6e9dc;
  --muted:#93a597;
  --ember:#f0a33a;
  --ember-dim:#7a5521;
  --moss:#8fc27a;
  --rare:#c79bf2;
  --danger:#e06c5a;
  --f-display:"Pirata One","Palatino Linotype",Georgia,serif;
  --f-body:"Karla",system-ui,-apple-system,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 150px}
.wrap{max-width:560px;margin:0 auto}
.brandline{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.sync{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.72rem;color:var(--muted);background:none;border:0;padding:2px 0;cursor:pointer;min-height:24px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--moss);box-shadow:0 0 6px var(--moss)}
.sync.stale i{background:var(--ember);box-shadow:0 0 6px var(--ember)}
.sync.err i{background:var(--danger);box-shadow:none}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:18px 12px;border-bottom:1px solid var(--line);margin-bottom:12px}
h1{font-family:var(--f-display);font-weight:400;font-size:2.1rem;line-height:1;margin:0;color:var(--fg)}
h1 span{color:var(--ember)}
.total{text-align:right;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;display:flex;gap:16px}
.total b{display:block;font-family:var(--f-num);font-size:1.2rem;color:var(--fg);letter-spacing:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* bottom dock: what you're doing + main sections */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto;border-top:1px solid var(--line)}
.bnav button{font:inherit;font-size:.72rem;font-weight:700;letter-spacing:.02em;color:var(--muted);background:none;border:0;padding:9px 2px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;min-width:0}
.bnav button b{font-family:var(--f-display);font-weight:400;font-size:1.15rem;line-height:1;color:inherit}
.bnav .ico{width:22px;height:22px;opacity:.6}
.bnav button[aria-current="page"] .ico{opacity:1}
.cskill span{display:flex;align-items:center;gap:4px}
.cskill .ico{width:14px;height:14px}
.bnav button[aria-current="page"]{color:var(--ember)}
.bnav button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--ember);border-radius:2px}
.badge{position:absolute;top:5px;left:calc(50% + 10px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--moss);color:var(--bg);font-family:var(--f-num);font-size:.66rem;line-height:17px;text-align:center}
/* skills overview */
.ovgroup{margin-top:18px}
.ovgroup:first-child{margin-top:4px}
.ovgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ovcard{font:inherit;color:var(--fg);text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:baseline;min-width:0}
.ovcard:hover{border-color:var(--ember-dim)}
.bankwrap{display:grid;grid-template-columns:146px minmax(0,1fr);gap:10px;align-items:start}
.minieq{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px}
.mload{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mload button{font:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 0;cursor:pointer;display:flex;justify-content:center}
.mload button[aria-pressed="true"]{border-color:var(--ember);background:var(--panel-2)}
.mload .ico{width:18px;height:18px}
.mgrid{display:grid;grid-template-columns:repeat(3,40px);gap:4px;justify-content:center}
.mslot{position:relative;width:40px;height:40px;font:inherit;background:var(--bg);border:1px dashed var(--line);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.mslot.full{border-style:solid;background:var(--panel-2)}
.mslot.sel{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember) inset}
.mslot .ico{width:28px;height:28px}
.mslot .sl{font-size:.5rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.mstat{display:flex;flex-direction:column;gap:1px;font-size:.7rem;color:var(--muted);text-align:center}
.mstat span:first-child{color:var(--ember);font-weight:700}
.bankmain{min-width:0}
.bankmain .slots{grid-template-columns:repeat(auto-fill,minmax(48px,1fr))}
.bslot .wtag{position:absolute;bottom:2px;right:4px;font-family:var(--f-num);font-size:.6rem;line-height:1;color:var(--ember);text-shadow:1px 1px 0 #000}
@media (max-width:360px){.bankwrap{grid-template-columns:1fr}.minieq{position:static}}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:5px}
.bslot{position:relative;aspect-ratio:1;max-width:100%;font:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.bslot:hover{border-color:var(--ember-dim)}
.bslot.rare{border-color:#5a4475}
.bslot[aria-pressed="true"]{border-color:var(--ember);background:var(--panel-2);box-shadow:0 0 0 1px var(--ember) inset}
.bslot .ico{width:34px;height:34px}
.bslot .qn{position:absolute;top:2px;left:4px;font-family:var(--f-num);font-size:.68rem;line-height:1;color:#f7d35a;text-shadow:1px 1px 0 #000}
.bslot .qn.k{color:#f2efe6}.bslot .qn.m{color:#8fc27a}
.sheet{position:fixed;left:0;right:0;bottom:calc(var(--dock-h, 112px));z-index:6;padding-inline:16px;pointer-events:none}
.sheet .in{max-width:560px;margin:0 auto;background:var(--panel-2);border:1px solid var(--ember-dim);border-radius:14px 14px 10px 10px;padding:12px 14px;box-shadow:0 -10px 30px rgba(0,0,0,.45);pointer-events:auto;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.sheet .ico{width:44px;height:44px;grid-row:span 2}
.sheet .nm{font-weight:700;font-size:1rem}
.sheet .nm.rare{color:var(--rare)}
.sheet .meta{font-size:.78rem;color:var(--muted)}
.sheet .desc{grid-column:1/-1;font-size:.84rem;color:var(--fg)}
.sheet .btns{grid-column:1/-1;margin-top:4px}
.sheet .x{grid-row:1;grid-column:3;font:inherit;font-size:1.2rem;line-height:1;background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 6px}
.cl-item{flex-direction:row !important;align-items:center;gap:8px !important}
.cl-item .ico{width:28px;height:28px;flex:none}
.cl-item:not(.got) .ico{filter:grayscale(1) brightness(.6);opacity:.55}
.cl-item .tx{display:flex;flex-direction:column;min-width:0}
.slot .n .ico{width:24px;height:24px;margin-right:6px;vertical-align:-7px}
.ico{width:20px;height:20px;image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:-4px;flex:none}
.ico.lg{width:30px;height:30px;vertical-align:-7px;margin-right:8px}
.ovcard .nm{display:flex;align-items:center;gap:7px;font-weight:700;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovcard .lv{font-family:var(--f-display);font-size:1.5rem;line-height:1;color:var(--ember)}
.ovcard .bar{grid-column:1/-1;margin:0;height:4px}
.ovcard .st{grid-column:1/-1;font-size:.74rem;color:var(--muted);min-height:1.1em}
.ovcard .st.go{color:var(--ember)}
.ovcard .st.ok{color:var(--moss)}
.ovcard.on{border-color:var(--ember)}
.back{font:inherit;font-size:.9rem;font-weight:600;color:var(--muted);background:none;border:0;padding:10px 0;cursor:pointer}
.back:hover{color:var(--fg)}
details.more{margin-top:8px;font-size:.8rem;color:var(--muted)}
details.more summary{cursor:pointer;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ ";color:var(--ember)}
details.more[open] summary::before{content:"− "}
details.more .perks{margin-top:6px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.filters button{font:inherit;font-size:.8rem;font-weight:600;white-space:nowrap;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;min-height:36px;padding:6px 13px;cursor:pointer}
.filters button[aria-pressed="true"]{color:var(--bg);background:var(--ember);border-color:var(--ember)}
.pagehead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:6px 0 10px}
.pagehead h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.8rem;line-height:1;color:var(--fg)}
.pagehead span{font-size:.8rem;color:var(--muted)}
.guide{font-size:.86rem;line-height:1.5;padding-left:18px;margin:0}
.guide li{margin-bottom:6px}
.guide b{color:var(--ember);font-weight:600}
.cl-total{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:baseline}
.cl-total b{font-family:var(--f-display);font-weight:400;font-size:1.6rem;color:var(--rare);line-height:1}
.cl-total span{font-size:.8rem;color:var(--muted)}
.cl-total .bar{grid-column:1/-1;margin:0;height:6px}
.cl-total .bar i,.cl-cat .bar i{background:var(--rare)}
.cl-cat{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:8px}
.cl-cat.done{border-color:#5a4475}
.cl-cat summary{list-style:none;cursor:pointer;padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline}
.cl-cat summary::-webkit-details-marker{display:none}
.cl-cat summary b{font-weight:700;font-size:.92rem}
.cl-cat summary .num{font-size:.8rem;color:var(--muted)}
.cl-cat summary .src{grid-column:1/-1;font-size:.74rem;color:var(--muted)}
.cl-cat summary .bar{grid-column:1/-1;margin:0;height:4px}
.cl-cat.done summary .num{color:var(--rare)}
.cl-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;padding:0 14px 12px}
.cl-item{border:1px dashed var(--line);border-radius:8px;padding:7px 9px;min-width:0;display:flex;flex-direction:column;gap:1px}
.cl-item .n{font-size:.82rem;font-weight:600;color:var(--muted)}
.cl-item .r{font-size:.7rem;color:var(--muted);font-family:var(--f-num)}
.cl-item.got{border-style:solid;border-color:#5a4475;background:var(--panel-2)}
.cl-item.got .n{color:var(--rare)}
.crumbs{font-size:.82rem;color:var(--muted);margin:2px 0 10px}
.crumbs b{color:var(--fg);font-weight:700}
.cl-list{display:flex;flex-direction:column;gap:8px}
.cl-row{font:inherit;color:var(--fg);text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:baseline}
.cl-row:hover{border-color:var(--ember-dim)}
.cl-row.done{border-color:#5a4475}
.cl-row .nm{font-weight:700;font-size:.92rem}
.cl-row .num{font-size:.8rem;color:var(--muted)}
.cl-row.done .num{color:var(--rare)}
.cl-row .src{grid-column:1/-1;font-size:.74rem;color:var(--muted)}
.cl-row .bar{grid-column:1/-1;margin:0;height:4px}
.cl-row .bar i{background:var(--rare)}
.eqwrap{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin-top:4px}
@media (max-width:420px){.eqwrap{grid-template-columns:1fr}}
.eqgrid{display:grid;grid-template-columns:repeat(3,60px);gap:6px;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.eqslot{position:relative;width:60px;height:60px;font:inherit;background:var(--bg);border:1px dashed var(--line);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.eqslot.full{border-style:solid;background:var(--panel-2)}
.eqslot.sel{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember) inset}
.eqslot .ico{width:38px;height:38px}
.eqslot .sl{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.eqslot .warn{position:absolute;top:2px;right:5px;color:var(--danger);font-weight:800}
.eqstats{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.eqstats .stat{display:flex;justify-content:space-between;font-size:.86rem;padding:3px 0;border-bottom:1px solid var(--line)}
.eqstats .stat span{color:var(--muted)}
.eqopt{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.eqopt.worn{border-color:var(--ember)}
.eqopt .ico{width:32px;height:32px}
.eqopt .tx{flex:1;display:flex;flex-direction:column;min-width:0}
.eqopt .tx b{font-size:.88rem}
.eqopt .tx span{font-size:.76rem;color:var(--muted)}
.qlist{display:flex;flex-direction:column;gap:8px}
.quest{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:5px}
.quest.ready{border-color:var(--moss);box-shadow:0 0 0 1px var(--moss) inset}
.quest.claimed{opacity:.6}
.quest .qh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.quest .qh b{font-weight:700;font-size:.92rem}
.quest .qh .num{font-size:.78rem;color:var(--muted)}
.quest.ready .qh .num{color:var(--moss)}
.quest .qd{font-size:.8rem;color:var(--muted)}
.quest .bar{margin:0;height:4px}
.quest .bar i{background:var(--ember)}
.quest .qr{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.quest .rws{display:flex;flex-wrap:wrap;gap:6px}
.rw{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:1px 9px 1px 3px}
.rw .ico{width:18px;height:18px}
.linkbtn{font:inherit;font-size:.84rem;font-weight:600;color:var(--ember);background:none;border:0;padding:8px 2px;cursor:pointer;text-decoration:underline}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
button{touch-action:manipulation}

.skillhead{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;padding-block:6px 14px}
.lvl{grid-row:span 2;font-family:var(--f-display);font-size:3rem;line-height:.9;color:var(--ember);min-width:2ch;text-align:center}
.skillhead h2{margin:0;font-size:1.05rem;font-weight:700}
.xpline{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;gap:8px}
.bar{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;grid-column:1/-1;margin-top:4px}
.bar i{display:block;height:100%;background:var(--moss);width:0}
.perks{grid-column:1/-1;font-size:.8rem;color:var(--muted);margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.chip.on{border-color:var(--ember-dim);color:var(--ember)}

.actions{display:flex;flex-direction:column;gap:8px}
.act{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;width:100%;font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.act:hover:not(:disabled){border-color:var(--ember-dim)}
.act .nm{font-weight:700}
.act .meta{grid-column:1;color:var(--muted);font-size:.78rem}
.act .side{grid-row:1/span 2;grid-column:2;text-align:right;font-size:.78rem;color:var(--muted)}
.act .side b{display:block;color:var(--moss);font-family:var(--f-num);font-size:.9rem}
.act .meta .ok{color:var(--moss)}
.act[aria-pressed="true"]{border-color:var(--ember);background:var(--panel-2)}
.act[aria-pressed="true"] .nm::after{content:" · active";color:var(--ember);font-weight:600;font-size:.8rem}
.act:disabled{opacity:.45;cursor:not-allowed}
.lock{color:var(--danger)}
.toggle{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted);margin-top:12px}
.toggle input{accent-color:var(--ember);width:18px;height:18px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.slot .q{font-family:var(--f-num);font-size:1.1rem}
.slot .n{font-weight:600;font-size:.88rem}
.slot .d{font-size:.75rem;color:var(--muted)}
.slot.rare{border-color:#5a4475}
.slot.rare .n{color:var(--rare)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btn{font:inherit;font-weight:600;font-size:.84rem;min-height:40px;padding:8px 12px;border-radius:7px;border:1px solid var(--ember-dim);background:transparent;color:var(--ember);cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.danger{border-color:#6a3128;color:var(--danger)}
.btn.solid{background:var(--ember);color:var(--bg);border-color:var(--ember)}
.empty{color:var(--muted);font-size:.9rem;padding:14px;border:1px dashed var(--line);border-radius:10px}

.patch{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.patch.ready{border-color:var(--moss)}
.patch.locked{opacity:.5}
.patch .ph{display:flex;justify-content:space-between;gap:8px;font-size:.85rem}
.patch .ph b{font-weight:700}
.patch .ph span{color:var(--muted)}
.patch .bar{margin:0}
.patch.ready .ph span{color:var(--moss)}
.patches{display:flex;flex-direction:column;gap:8px}
.cmbtop{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;padding-block:6px 10px}
.cmbtop .lvl{grid-row:span 2}
.cmbtop h2{margin:0;font-size:1.05rem}
.hpline{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.hpbar{height:10px;background:var(--panel-2);border-radius:5px;overflow:hidden;grid-column:1/-1}
.hpbar i{display:block;height:100%;background:var(--danger);width:100%}
.cskills{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-block:4px 12px}
.cskill{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0;display:flex;flex-direction:column;gap:3px}
.cskill span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cskill b{font-family:var(--f-display);font-weight:400;font-size:1.6rem;line-height:1;color:var(--ember)}
.cskill .bar{margin:0;height:4px}

const XP_TABLE = [0, 0];
{ let pts = 0; for (let l = 1; l < 99; l++) { pts += Math.floor(l + 300 * Math.pow(2, l / 7)); XP_TABLE[l + 1] = Math.floor(pts / 4); } }
const levelOf = xp => { let l = 1; while (l < 99 && xp >= XP_TABLE[l + 1]) l++; return l; };

function rollTable(table) {
  const total = table.reduce((s, e) => s + e.weight, 0);
  let r = Math.random() * total;
  for (const e of table) if ((r -= e.weight) < 0) return e.item ? { item: e.item, qty: e.min + Math.floor(Math.random() * (e.max - e.min + 1)) } : null;
  const e = table[table.length - 1]; return { item: e.item, qty: e.min };
}

  return [
    { label: axe ? ITEMS[axe[0]].name : "No axe", mult: axe ? axe[1] : 1, on: !!axe },
    { label: `Warm hands (Firemaking ${fm})`, mult: 1 - 0.005 * fm, on: fm > 1 },

  ];

function actionTime(skill, a) {
  if (skill === "combat") return roundMs();
  const over = Math.max(0, lvl(skill) - a.lvl);
  let t = a.time * (1 - Math.min(0.3, over * 0.01));
  if (skill === "woodcutting") for (const p of wcSpeedParts()) t *= p.mult;
  if (skill === "agility" && has("lightfoot_boots")) t *= 0.95;
  if (skill === "fishing" && has("lucky_lure")) t *= 0.9;
  if (skill === "fishing") { if (worn("tide_ring")) t *= 0.9; if (has("tide_harpoon")) t *= 0.8; if (buffOn("angler")) t *= 0.85; }
  if (skill === "woodcutting" && buffOn("forester")) t *= 0.85;

  if (skill === "smithing" && a.smelt) t *= 1 - 0.005 * lvl("firemaking");

}

  $("bnav").innerHTML = SECTIONS.map(([id, n, g]) => `<button id="nav-${id}" data-tab="${id}" ${cur === id ? 'aria-current="page"' : ""}>${iconURL(NAV_ICON[id]) ? icon(NAV_ICON[id]) : `<b aria-hidden="true">${g}</b>`}${n}${b[id] ? `<span class="badge">${b[id] > 99 ? "99+" : b[id]}</span>` : ""}</button>`).join("");

function skillStatus(k) {
  const now = Date.now();
  if (state.active && state.active.skill === k) return ["go", "Training: " + findAction(k, state.active.id).name];
  if (k === "farming") { const r = state.patches.filter(p => p && now >= p.readyAt).length, g = state.patches.filter(p => p && now < p.readyAt).length; return r ? ["ok", `${r} ready to harvest`] : g ? ["", `${g} growing`] : ["", "Patches empty"]; }
  if (k === "seafaring") { const b = Object.values(state.boats), back = b.filter(t => t && now >= t.readyAt).length, sea = b.filter(t => t && now < t.readyAt).length;
    return back ? ["ok", `${back} back in port${sea ? ` · ${sea} at sea` : ""}`] : sea ? ["", `${sea} at sea`] : b.length ? ["", "Boats docked"] : ["", "No boats yet"]; }
  if (k === "slayer") { const m = taskMon(); return m ? ["", `${state.slayer.task.left} ${m.name.toLowerCase()} left`] : ["", "No task"]; }
  if (k === "brewing") { const r = state.barrels.filter(p => p && now >= p.readyAt).length, g = state.barrels.filter(p => p && now < p.readyAt).length; return r ? ["ok", `${r} ready to collect`] : g ? ["", `${g} fermenting`] : ["", "Barrels empty"]; }
  return ["", ""];
}
function overviewPanel() {
  return SKILL_GROUPS.map(([g, ks]) => `<div class="ovgroup"><h3>${g}</h3><div class="ovgrid">` + ks.map(k => {
    const [cls, txt] = skillStatus(k), l = lvl(k);

  }).join("") + `</div></div>`).join("");
}
const backBtn = () => `<button class="back" id="backBtn" data-tab="skills">← All skills</button>`;

function skillHead(skill) {
  let perks = "";
  if (skill === "woodcutting") perks = wcSpeedParts().map(p => `<span class="chip ${p.on ? "on" : ""}">${esc(p.label)}${p.on ? ` −${Math.round((1 - p.mult) * 1000) / 10}% time` : ""}</span>`).join("");
  else if (skill === "firemaking") perks = `<span class="chip on">Each level: chop 0.5% faster</span><span class="chip on">Every burn leaves ashes</span><span class="chip ${has("ember_charm") ? "on" : ""}">Ember charm${has("ember_charm") ? ": 10% log save" : " (not owned)"}</span>`;
  else if (skill === "agility") perks = `<span class="chip on">Each level: stuns ${Math.round(Math.min(0.6, lvl("agility") * 0.01) * 100)}% shorter</span><span class="chip ${lightfootCount() ? "on" : ""}">Lightfoot ${lightfootCount()}/4</span><span class="chip ${has("lightfoot_boots") ? "on" : ""}">Boots: laps 5% faster</span>`;
  else if (skill === "thieving") perks = thieveParts(TARGETS[0]).slice(2).map(p => `<span class="chip ${p.add ? "on" : ""}">${esc(p.label)}${p.add ? ` +${Math.round(p.add * 100)}%` : ""}</span>`).join("") + `<span class="chip on">Agility ${lvl("agility")}: stun −${Math.round(Math.min(0.6, lvl("agility") * 0.01) * 100)}%</span>`;
  else if (skill === "mining") { const p = PICKAXES.find(([id]) => has(id)); perks = `<span class="chip ${p ? "on" : ""}">${p ? ITEMS[p[0]].name + " −" + Math.round((1 - p[1]) * 100) + "% time" : "No pickaxe (smith one)"}</span><span class="chip on">Ore feeds Smithing</span>`; }
  else if (skill === "smithing") perks = `<span class="chip on">Firemaking ${lvl("firemaking")}: smelt ${(lvl("firemaking") * 0.5).toFixed(1)}% faster</span><span class="chip on">Makes axes, pickaxes, swords, platebodies</span><span class="chip">Monster uniques can't be smithed</span>`;
  else if (skill === "enchanting") perks = `<span class="chip on">Runes and staffs for Magic</span><span class="chip on">Gems from essence rocks (1/80) and geodes</span><span class="chip on">Jewellery works while it's in your bank</span>`;
  else if (skill === "brewing") perks = `<span class="chip on">Barrels ferment while you're away</span><span class="chip ${worn("roots_ring") ? "on" : ""}">Ring of roots${worn("roots_ring") ? ": 25% sooner" : " (Enchanting)"}</span>`;
  else if (skill === "seafaring") perks = `<span class="chip on">Voyages ${(Math.min(0.3, lvl("seafaring") * 0.005) * 100).toFixed(1)}% shorter</span><span class="chip ${has("captain_compass") ? "on" : ""}">Captain's compass${has("captain_compass") ? ": −25%" : " (Stormwrack)"}</span>`;
  else if (skill === "fletching") perks = `<span class="chip on">Bows and arrows for Ranged</span><span class="chip on">Arrows: a bar + a log makes 15</span>`;
  else if (skill === "fishing") perks = `<span class="chip ${has("lucky_lure") ? "on" : ""}">Lucky lure${has("lucky_lure") ? ": 10% faster" : " (from caskets)"}</span><span class="chip on">Raw fish feeds Cooking</span>`;
  else if (skill === "cooking") perks = `<span class="chip on">Firemaking ${lvl("firemaking")}: burn −${(lvl("firemaking") * 0.3).toFixed(1)}%</span><span class="chip on">Better logs burn longer</span><span class="chip on">Fuel: <span class="num" data-fuel></span> logs</span>`;
  else if (skill === "slayer") perks = `<span class="chip on">On task: ${SLAYER_XP} Slayer xp per monster hitpoint</span><span class="chip on">Slayer monsters need a Slayer level</span><span class="chip ${worn("slayer_helm") ? "on" : ""}">Slayer helm${worn("slayer_helm") ? ": +15% on task" : " (Slayer shop)"}</span><span class="chip ${has("echo_charm") ? "on" : ""}">Echo charm${has("echo_charm") ? ": +10% xp" : " (Gloom bats)"}</span><span class="chip ${has("bone_charm") ? "on" : ""}">Bone charm${has("bone_charm") ? ": +5% xp" : " (Slayer shop)"}</span>`;
  else perks = `<span class="chip on">Crops grow while you're away</span><span class="chip on">${FERTILISE_COST} ashes: 2× speed, +25% yield</span>`;
  if (SKILL_PETS[skill]) { const pt = SKILL_PETS[skill]; perks += `<span class="chip ${has(pt) ? "on" : ""}">${has(pt) ? `${ITEMS[pt].name}: +3% xp` : "Pet: ???"}</span>`; }
  const eyrieItem = { woodcutting:"bird_whistle", firemaking:"ember_lantern", farming:"gold_trowel", thieving:"thief_satchel", combat:"warding_charm", agility:"windrunner_cape", fishing:"heron_float", cooking:"chef_gauntlets", mining:"prospector_charm" }[skill];
  if (eyrieItem) perks += `<span class="chip ${has(eyrieItem) ? "on" : ""}">${ITEMS[eyrieItem].name}${has(eyrieItem) ? ": " + ITEMS[eyrieItem].desc.replace(/\.$/, "").toLowerCase() : " (The Eyrie)"}</span>`;
  return `<div class="skillhead">
    <div class="lvl">${lvl(skill)}</div>

    <div class="xpline"><span class="num" data-xp="${skill}"></span><span class="num" data-xpnext="${skill}"></span></div>
    <div class="bar"><i data-xpbar="${skill}"></i></div>

}
function splitPerks(html) {
  const t = document.createElement("template"); t.innerHTML = html;
  const chips = [...t.content.querySelectorAll(".chip")];
  const on = chips.filter(c => c.classList.contains("on")).map(c => c.outerHTML).join(""), off = chips.filter(c => !c.classList.contains("on")).map(c => c.outerHTML).join("");
  const n = chips.length - chips.filter(c => c.classList.contains("on")).length;
  return `<div class="perks">${on}</div>${n ? `<details class="more"><summary>${n} more bonus${n > 1 ? "es" : ""} to unlock</summary><div class="perks">${off}</div></details>` : ""}`;
}

function actionList(skill) {
  const list = ACTIONS[skill]; const l = lvl(skill);
  let lastSection = "";
  // Smithing has many recipes: show what you can make plus the next two to unlock
  const shown = CRAFT_SKILLS.includes(skill) ? list.filter(a => a.lvl <= l).concat(list.filter(a => a.lvl > l).sort((x, y) => x.lvl - y.lvl).slice(0, 2)) : list;
  if (CRAFT_SKILLS.includes(skill)) { const order = [...new Set(list.map(a => a.section))]; shown.sort((x, y) => order.indexOf(x.section) - order.indexOf(y.section) || x.lvl - y.lvl); }
  let h = `<div class="actions">` + shown.map(a => {
    const head = a.section && a.section !== lastSection ? `<p class="sub">${esc(a.section)}</p>` : ""; lastSection = a.section || "";
    const locked = l < a.lvl;
    const noLogs = ((skill === "firemaking" || skill === "cooking") && !has(a.item)) || (CRAFT_SKILLS.includes(skill) && !!smithBlock(a));
    const active = state.active && state.active.skill === skill && state.active.id === a.id;
    const t = (actionTime(skill, a) / 1000).toFixed(2);
    const meta = locked ? `<span class="lock">Requires level ${a.lvl}</span>`
      : skill === "woodcutting" ? `${t}s · <span class="num" data-q="${a.item}"></span> in bank · nest 1/${Math.round(1 / (a.nest * (has("bird_whistle") ? 1.5 : 1)))}`
      : skill === "agility" ? `${t}s lap · fail ${Math.round(lapFail(a) * 100)}% · feather 1/${(1 / a.mark).toFixed(1).replace(".0", "")} · Lightfoot 1/${Math.round(1 / a.rare)}`
      : skill === "thieving" ? `<span class="ok">${Math.round(thieveChance(a) * 100)}% success</span> · stun ${(stunMs(a) / 1000).toFixed(1)}s · ${a.loot.filter(e => e.item !== "coins").map(e => ITEMS[e.item].name.toLowerCase()).join(", ") || a.loot[0].min + " coins"}`
      : skill === "mining" ? `${t}s · <span class="num" data-q="${a.item}"></span> in bank · geode 1/${Math.round(1 / geodeChance(a))}`
      : skill === "enchanting" ? `${a.section === "Jewellery" || a.section === "Staffs" ? `<span class="ok">${esc(ITEMS[a.out].desc.replace("Enchanted. ", ""))}</span>${has(a.out) ? " (owned)" : ""}<br>` : ""}${inputsText(a)}${noLogs ? ` · <span class="lock">${smithBlock(a).replace("Out of", "Need more")}</span>` : ""}`
      : skill === "smithing" || skill === "fletching" ? `${t}s · ${inputsText(a)}${noLogs ? ` · <span class="lock">${smithBlock(a).replace("Out of", "Need more")}</span>` : ""}`
      : skill === "fishing" ? `${t}s · <span class="num" data-q="${a.item}"></span> in bank · casket 1/${Math.round(1 / casketChance(a))}`
      : noLogs ? `No ${ITEMS[a.item].name.toLowerCase()}. ${a.hint || "Chop some first."}`
      : skill === "cooking" ? `${t}s · <span class="num" data-q="${a.item}"></span> to cook · burn ${Math.round(burnChance(a) * 100)}%`
      : `${t}s · <span class="num" data-q="${a.item}"></span> ${ITEMS[a.item].name.toLowerCase()} to burn`;
    return head + `<button class="act" id="act-${skill}-${a.id}" data-skill="${skill}" data-id="${a.id}" aria-pressed="${active}" ${locked || noLogs ? "disabled" : ""}>
      <span class="nm">${esc(a.name)}</span><span class="meta">${meta}</span>
      <span class="side"><b>+${a.xp}</b>xp</span></button>`;
  }).join("") + `</div>`;
  if (CRAFT_SKILLS.includes(skill) && shown.length < list.length) h += `<p class="note">More recipes unlock as you level.</p>`;
  if (skill === "cooking") {
    const cur = fuelItem();
    h += `<h3>Fire fuel</h3><div class="slots" style="grid-template-columns:repeat(auto-fill,minmax(54px,1fr))">` +
      [["auto", "Cheapest"], ...FUEL.map(f => [f, ITEMS[f].name])].map(([k, n]) => {
        const pressed = (state.opts.fuel || "auto") === k, out = k !== "auto" && !has(k);
        return `<button class="bslot" id="fuel-${k}" data-fuel-pick="${k}" aria-pressed="${pressed}" ${out ? "disabled style=\"opacity:.4\"" : ""} aria-label="${esc(n)}">${k === "auto" ? `<span style="font-size:.7rem;font-weight:700;color:var(--muted)">Auto</span>` : `<span class="qn" data-qs="${k}"></span>${icon(k)}`}</button>`;
      }).join("") + `</div>
      <p class="note">${cur ? `Burning <b>${ITEMS[cur].name.toLowerCase()}</b>: about one log every ${Math.round(1 / FUEL_BURN[cur])} cooks.` : "No logs to burn. Chop some first."} Logs ${Math.round(1 / FUEL_BURN.logs)} cooks, oak ${Math.round(1 / FUEL_BURN.oak_logs)}, willow ${Math.round(1 / FUEL_BURN.willow_logs)}, maple ${Math.round(1 / FUEL_BURN.maple_logs)}.${state.opts.fuel !== "auto" && !has(state.opts.fuel) ? " Your chosen logs ran out, so the cheapest ones are used." : ""}</p>`;
  }
  if (skill === "firemaking") h += `<label class="toggle"><input type="checkbox" id="autoChop" ${state.opts.autoChop ? "checked" : ""}> When I run out of logs, go back to chopping</label>`;
  return h;
}

function itemCat(k) {
  const it = ITEMS[k] || {};
  if (["coins","skyfeather","doubloon"].includes(k)) return "Currency";
  if (["bird_nest","casket","geode","treasure_map"].includes(k)) return "To open";
  if (it.buff) return "Brews";
  if (FOOD[k]) return "Food";
  if (k.endsWith("_rune") || k.endsWith("_arrow")) return "Ammo & runes";
  const gear = [...WEAPONS, ...ARMOURS, ...AXES, ...PICKAXES, ...BOWS, ...STAFFS].map(x => x[0]);
  if (gear.includes(k) || (it.rare && !it.sell) || PETS.includes(k)) return "Gear & bonuses";
  return "Materials";
}
const lootTable = (title, table) => { const t = table.reduce((s, e) => s + e.weight, 0);
  return `<h3>${title}</h3><table class="loot">` + table.map(e => `<tr><td>${ITEMS[e.item].name}${e.max > 1 ? ` ×${e.min}–${e.max}` : ""}</td><td class="num">${(e.weight / t * 100).toFixed(1)}%</td></tr>`).join("") + `</table>`; };

    const lt = state.opts.ctype || "melee";
    h += `<div class="bankwrap"><aside class="minieq" aria-label="Worn equipment">
      <div class="mload">${[["melee","attack"],["ranged","ranged"],["magic","magic"]].map(([k, ic]) => `<button id="bload-${k}" data-ctype="${k}" aria-pressed="${lt === k}" title="${CTYPES[k]} loadout">${icon(ic)}</button>`).join("")}</div>
      <div class="mgrid"><span></span>${mcell("head")}<span></span>${mcell("cape")}${mcell("amulet")}${mcell("ammo")}${mcell("weapon")}${mcell("body")}${mcell("shield")}<span></span>${mcell("legs")}<span></span><span></span>${mcell("ring")}<span></span></div>
      <div class="mstat"><span>${CTYPES[lt]}</span><span>Def +${defBonus()}</span><span>Max hit ${playerMax()}</span></div>
    </aside><div class="bankmain">`;
    h += `<div class="filters">${slotFilter ? `<button id="bf-slot" data-bfilter="All" aria-pressed="true">${SLOT_NAMES[slotFilter]} gear ×</button>` : ""}${cats.map(c => `<button id="bf-${c.replace(/\W/g, "")}" data-bfilter="${c}" aria-pressed="${bankFilter === c}">${c}</button>`).join("")}</div>`;

    h += shown.length ? `<div class="slots">` + shown.map(k => { const it = ITEMS[k] || {}, q = qty(k), qc = q >= 1e7 ? "m" : q >= 1e5 ? "k" : "";

    }).join("") + `</div><p class="note">Tap an item to see what it does, open, wear or sell it. Tap an empty equipment slot to see what fits.</p>${bankSel ? `<div style="height:170px" aria-hidden="true"></div>` : ""}` : slotFilter ? `<div class="empty">You don't own any ${SLOT_NAMES[slotFilter].toLowerCase()} gear yet.</div>` : `<div class="empty">Your bank is empty. Pick a skill and start training, and items will appear here.</div>`;

      <p class="note">More shops: <b>The Eyrie</b> on the Agility page takes Skyfeathers, and the <b>Black Flag Trader</b> in Voyages takes doubloons. Swords, armour, axes and pickaxes come from Smithing.</p>`;
  } else {
    h += lootTable("Bird's nest", NEST_TABLE) + lootTable("Casket", CASKET_TABLE) + lootTable("Geode", GEODE_TABLE) + lootTable("Essence rock gems", GEM_TABLE);
    h += `<p class="note">Monster and island uniques are listed in the collection logs on the Combat and Voyages pages.</p>`;
  }
  return h;

/* ================= COLLECTION LOG ================= */
const pct = (table, item) => { const t = table.reduce((s, e) => s + e.weight, 0), e = table.find(x => x.item === item); return e ? e.weight / t : 0; };
const oneIn = p => p > 0 ? `1/${fmt(Math.round(1 / p))}` : "";
// Collection log tree: group > entry > loot. "tracked" entries count drops from that source only.
function clogTree() {
  const tableItems = (table, per) => table.filter(e => e.item).map(e => ({ item: e.item, rate: `${oneIn(pct(table, e.item))} ${per}` }));
  const uniq = (list, per) => list.map(u => ({ item: u.item, rate: `${oneIn(u.chance)} ${per}`, unique: true }));
  const petSrc = p => MONSTERS.find(m => m.uniques.some(u => u.item === p)) || VOYAGES.find(v => v.uniques.some(u => u.item === p));
  return [
    { id: "monsters", name: "Monsters", entries: MONSTERS.map(m => ({ id: "mon-" + m.id, name: m.name, tracked: true, sub: `${fmt(state.kills[m.id] || 0)} kills`,
        items: [...m.always.map(e => ({ item: e.item, rate: "Always" })), ...tableItems(m.table, "per kill"), ...uniq(m.uniques, "per kill")] })) },
    { id: "voyages", name: "Voyages", entries: VOYAGES.map(v => ({ id: "voy-" + v.id, name: v.name, tracked: true, sub: `${VOYAGE_TYPES[v.type]} · ${fmt(state.islands[v.id] || 0)} trips`,

  $("buffs").innerHTML = Object.keys(state.buffs).map(k => `<span class="buff">${BUFF_NAMES[k]}<span class="num" data-buff="${k}"></span></span>`).join("");
}

    ctx.font = "700 13px Karla, sans-serif"; ctx.lineWidth = 3; ctx.strokeStyle = OUTLINE; ctx.strokeText("Build a boat below to start sailing", W / 2, seaTop + 40); ctx.fillStyle = "#e6e9dc"; ctx.fillText("Build a boat below to start sailing", W / 2, seaTop + 40);
    return;
  }
  const lane = (H - seaTop - 8) / owned.length;
  owned.forEach((b, i) => {
    const trip = state.boats[b.id], sp = BOAT_SPRITES[b.id];
    const y = seaTop + lane * (i + 1) - 4 + (still ? 0 : Math.sin(now / 500 + i) * 2);
    let x = dockX + 28, flip = false, label = `${b.name} · docked`, back = false;
    if (trip) {
      const v = VOYAGES.find(q => q.id === trip.dest), p = Math.min(1, (now - trip.startAt) / Math.max(1, trip.readyAt - trip.startAt));
      // ignore real-time drift: the scene uses wall-clock time, the game uses Date.now()
      const pp = Math.min(1, (Date.now() - trip.startAt) / Math.max(1, trip.readyAt - trip.startAt));
      if (pp >= 1) { back = true; label = `${b.name} · back from ${v.name}!`; }
      else {
        const span = isleX - dockX - 60;
        if (pp < 0.5) { x = dockX + 28 + (pp / 0.5) * span; } else { x = dockX + 28 + (1 - (pp - 0.5) / 0.5) * span; flip = true; }
        label = `${v.name} · ${dur(trip.readyAt - Date.now())}`;
        // wake behind the boat
        ctx.fillStyle = "#cfe6f5"; ctx.globalAlpha = 0.5; for (let k = 1; k < 4; k++) ctx.fillRect(x + (flip ? 1 : -1) * (22 + k * 8), y - 2 + (k % 2) * 2, 6, 2); ctx.globalAlpha = 1;
      }
    }
    const r = drawGrid(ctx, "boat:" + b.id, sp.grid, BOAT_PAL, x, y, sp.s, flip);
    if (back) { const bounce = still ? 0 : Math.abs(Math.sin(now / 250)) * 5; drawIcon(ctx, "casket", x + r.w / 2 + 10, y - r.h / 2 - bounce, 22); }
    // label sits beside the boat, on whichever side has room
    ctx.font = "800 11px Karla, sans-serif"; ctx.lineWidth = 3; ctx.strokeStyle = OUTLINE;
    const right = x < W * 0.55, extra = back ? 30 : 8, lx = right ? x + r.w / 2 + extra : x - r.w / 2 - 8, ly = y - r.h / 2 + 4;
    ctx.textAlign = right ? "left" : "right";
    ctx.strokeText(label, lx, ly); ctx.fillStyle = back ? "#7dff6a" : "#ffffff"; ctx.fillText(label, lx, ly);
  });
}

function report(sum, away) {
  const uniq = sum.uniques || [];
  for (const r of sum.rare) { if (uniq.includes(r)) continue; toast(`Rare drop: ${r}!`, true); log(`Rare drop: <b>${r}</b>`, "r"); }
  for (const u of uniq) { toast(`Unique drop: ${u}!`, true); log(`Unique drop: <b>${u}</b>`, "r"); }
  // away: one line per skill (start level → highest level); live: announce each level as it happens
  const ranges = Object.entries(sum.lvlRange || {}).map(([k, [a, b]]) => `${SKILLS[k].name} level ${a} → ${b}`);
  if (away) for (const r of ranges) log(`<b>${r}</b>`, "l");
  else for (const l of sum.levels) announceLevel(l);
  for (const [k, [a, b]] of Object.entries(sum.lvlRange || {})) levelPop(k, a, b);
  for (const n of sum.notes) { toast(n); log(n); }
  const ready = state.patches.filter(p => p && Date.now() >= p.readyAt).length;
  const brewsReady = state.barrels.filter(p => p && Date.now() >= p.readyAt).length, shipsBack = Object.values(state.boats).filter(t => t && Date.now() >= t.readyAt).length;
  if (away && (brewsReady || shipsBack)) sum.notes.push([brewsReady ? `${brewsReady} barrel${brewsReady > 1 ? "s" : ""} ready to collect` : "", shipsBack ? `${shipsBack} boat${shipsBack > 1 ? "s" : ""} back in port` : ""].filter(Boolean).join(", "));
  if (away && (sum.actions || ready)) {
    const items = Object.entries(sum.items).filter(([, q]) => q).map(([k, q]) => `<li>${q > 0 ? "+" : ""}${fmt(q)} ${esc(ITEMS[k].name)}</li>`).join("");
    const xp = Object.entries(sum.xp).map(([k, x]) => `<li>+${fmt(x)} ${SKILLS[k].name} xp</li>`).join("");
    const fails = (sum.fails ? `<li>${fmt(sum.fails)} failed attempts</li>` : "") + (sum.kills ? `<li>${fmt(sum.kills)} monsters defeated</li>` : "") + (sum.ate ? `<li>Ate ${fmt(sum.ate)} food</li>` : "") + (sum.rests ? `<li>Stopped to rest ${fmt(sum.rests)} times</li>` : "");
    $("away").innerHTML = `<div class="away"><h4>While you were away</h4><ul>${ranges.map(r => `<li><b>${esc(r)}</b></li>`).join("")}${xp}${items}${fails}${sum.notes.map(n => `<li>${esc(n)}</li>`).join("")}${ready ? `<li>${ready} farming patch${ready > 1 ? "es are" : " is"} ready to harvest</li>` : ""}</ul><button class="btn" id="dismissAway">Got it</button></div>`;
  }
}

/* ================= CLOUD SAVE (Supabase) =================
   Sign in with an emailed code; the save lives in the `saves` table (one row per player).
   Every write gets a new random `rev`. An update only succeeds if the row still has the rev this
   device last saw, so two devices can never silently overwrite each other. */
const CLOUD_META_KEY = "thornwick-cloud";
const cloudOn = !!(CLOUD.url && CLOUD.key);
let started = false;   // offline progress has been applied and the game loop is running
let cm = {};              // { s: session, rev, synced, dev, email }
try { cm = JSON.parse(localStorage.getItem(CLOUD_META_KEY)) || {}; } catch (e) {}
if (!cm.dev) cm.dev = Math.random().toString(36).slice(2, 10);
const cloud = { step: cm.s ? "in" : "out", email: cm.email || "", msg: "", busy: false, ready: false, prompt: null, emailDraft: null, codeDraft: "" };
function saveMeta() { try { localStorage.setItem(CLOUD_META_KEY, JSON.stringify(cm)); } catch (e) {} }
const newRev = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function cloudSay(m) { cloud.msg = m; for (const id of ["cloudMsg", "loginMsg"]) { const el = $(id); if (el) el.textContent = m; } }
function cloudRender() { render(); renderLogin(); }
function ago(t) {
  if (!t) return "never";
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 45) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " days ago";
}

async function api(path, opt = {}, auth = true) {
  const headers = { apikey: CLOUD.key, "Content-Type": "application/json", ...(opt.headers || {}) };
  if (auth) { const t = await accessToken(); if (!t) throw { status: 401, msg: "Signed out" }; headers.Authorization = "Bearer " + t; }
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), opt.timeout || 8000);
  let res;
  try { res = await fetch(CLOUD.url.replace(/\/$/, "") + path, { method: opt.method || "GET", headers, body: opt.body ? JSON.stringify(opt.body) : undefined, keepalive: !!opt.keepalive, signal: opt.keepalive ? undefined : ctl.signal }); }
  catch (e) { throw { status: 0, msg: "Can't reach the cloud right now" }; }
  finally { clearTimeout(timer); }
  const txt = await res.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
  if (!res.ok) throw { status: res.status, msg: (j && (j.msg || j.message || j.error_description || j.error)) || "Cloud error " + res.status, code: j && j.code };
  return j;
}

// Decide between this device's save and the cloud's. atStart: before offline progress is applied.
async function cloudCheck(atStart, fromSignIn) {

  let row;

    const head = await fetchRow("rev,device");
    if (head && head.rev === cm.rev) { cloud.ready = true; return push(); }
    row = head && await fetchRow("rev,device,data,total_level,updated_at");
  } catch (e) { cloud.ready = true; if (e.status !== 401) cloudSay(e.msg + ". Playing on this device's save."); return; }
  cloud.ready = true;
  if (!row) { cm.rev = null; return push(); }                                      // first upload
  if (row.device === cm.dev) { cm.rev = row.rev; return push(); }                  // an older upload from here
  const untouched = cm.synced && state.last <= cm.synced + 2000;
  if (untouched || xpSum() < 2000) return adopt(row, atStart);                    // nothing new here: take the cloud
  return askWhich(row, atStart, fromSignIn);
}

  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
  if (started) {
    const away = Date.now() - (state.last || Date.now());

}

let pushing = false;
async function push(keepalive) {
  if (!cloudOn || !cm.s || !started || !cloud.ready || cloud.prompt || pushing) return;
  save();
  const rev = newRev(), last = state.last;
  const body = { data: state, rev, device: cm.dev, total_level: totalLevel(), updated_at: new Date().toISOString() };
  if (keepalive) {                                   // page is closing: fire and assume it lands
    const t = cm.s.exp - 60000 > Date.now() ? cm.s.at : null; if (!t || !cm.rev) return;
    const json = JSON.stringify(body); if (json.length > 60000) return;
    fetch(`${CLOUD.url.replace(/\/$/, "")}/rest/v1/saves?user_id=eq.${cm.s.uid}&rev=eq.${cm.rev}`, { method: "PATCH", keepalive: true, headers: { apikey: CLOUD.key, Authorization: "Bearer " + t, "Content-Type": "application/json", Prefer: "return=minimal" }, body: json }).catch(() => {});
    cm.rev = rev; cm.synced = last; cm.at = Date.now(); saveMeta(); return;
  }
  pushing = true;
  try {
    if (!cm.rev) await api("/rest/v1/saves", { method: "POST", headers: { Prefer: "return=minimal" }, body: { user_id: cm.s.uid, ...body } });
    else {
      const out = await api(`/rest/v1/saves?user_id=eq.${cm.s.uid}&rev=eq.${cm.rev}&select=rev`, { method: "PATCH", headers: { Prefer: "return=representation" }, body });
      if (!out || !out.length) { pushing = false; cloud.ready = true; return cloudCheck(false); }   // someone else wrote first
    }
    cm.rev = rev; cm.synced = last; cm.at = Date.now(); saveMeta();
    if (cloud.msg) cloudSay("");
    hsSync();
  } catch (e) {
    pushing = false;
    if (e.status === 409) return cloudCheck(false);
    if (e.status !== 401) cloudSay(e.msg + ". Will try again in a minute.");
    return;
  }

}

// three heroes round a campfire on the login screen
function heroLoop() {
  const cv = $("loginScene"); if (!cv) return;
  const draw = now => {
    if (!loginOpen()) return;
    const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const ctx = cv.getContext && cv.getContext("2d"); if (!ctx) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.imageSmoothingEnabled = false; ctx.clearRect(0, 0, w, h);
    const t = reduceMotion() ? 0 : now / 1000, ground = h - 18, mid = w / 2;
    ctx.fillStyle = "#1d3327"; ctx.fillRect(0, ground, w, h - ground);
    ctx.fillStyle = "#24402f"; for (let x = 4; x < w; x += 22) ctx.fillRect(x, ground, 10, 3);
    // fire
    const fl = [["#d2452f", 14], ["#f0a33a", 9], ["#f7d35a", 5]];
    ctx.fillStyle = "#0b0b0d"; ctx.fillRect(mid - 20, ground - 7, 40, 7); ctx.fillStyle = "#6b4a2a"; ctx.fillRect(mid - 18, ground - 6, 36, 5); ctx.fillStyle = "#4a2e16"; ctx.fillRect(mid - 6, ground - 6, 3, 5); ctx.fillRect(mid + 8, ground - 6, 3, 5);
    fl.forEach(([c, r], i) => { const k = 1 + 0.15 * Math.sin(t * 9 + i * 2); ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(mid, ground - 6 - r * k, r * 0.8, r * 1.4 * k, 0, 0, 7); ctx.fill(); });
    ctx.globalAlpha = 0.12 + 0.04 * Math.sin(t * 7); ctx.fillStyle = "#f0a33a"; ctx.beginPath(); ctx.ellipse(mid, ground - 8, 90, 38, 0, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    const unit = Math.min(64, w / 6);   // about one hero's width
    const heroes = [["archer", -2.35, false], ["warrior", -1.2, false], ["wizard", 1.4, true]];
    heroes.forEach(([k, off, flip], i) => {
      const sp = SPRITES[k]; if (!sp) return;
      const bob = Math.round(Math.sin(t * 2 + i * 1.7) * 1.5);
      drawSprite(ctx, sp, mid + off * unit, ground + bob, unit / 12.8, flip, 1);
    });
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
}

let lastFrame = 0, lastSave = Date.now(), lastSigCheck = 0, lastQuestCheck = 0;
function frame(now) {
  const dt = Math.max(0, now - lastFrame); lastFrame = now;
  const sum = advance(dt);
  if (sum.actions || sum.notes.length) report(sum, dt > 60000);
  if (now - lastQuestCheck > 1000) { lastQuestCheck = now; checkQuests(); }
  if (now - lastSigCheck > 250 || sum.notes.length) { lastSigCheck = now; if (signature() !== lastSig) render(); }
  if (dt > 5000) { fxq = []; skq = []; }
  update(); renderNow(); drawScene(now); drawSkillScene(now); drawVoyageScene(now);
  if (Date.now() - lastSave > 5000) { save(); lastSave = Date.now(); }
  requestAnimationFrame(frame);
}

function start(data) {

    return;

}
// check the cloud before applying offline progress (gives up after a few seconds)
function cloudThenBegin() {
  const wait = cloudCheck(true);
  let done = false; const go = () => { if (!done) { done = true; cloud.ready = true; begin(); } };
  Promise.resolve(wait).then(go, go); setTimeout(() => { if (!cloud.prompt) go(); }, 6000);
}
function begin() {
  started = true;

  if (away > 2000) report(advance(away), away > 60000);
  fxq = [];
  state.last = Date.now();
  render(); renderNow();
  lastFrame = performance.now(); requestAnimationFrame(frame);
